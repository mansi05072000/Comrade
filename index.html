<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Proposal</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #e6e6fa; /* light purple background */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Cursive', sans-serif;
      flex-direction: column;
    }

    .proposal {
      text-align: center;
      color: #4b0082; /* deep purple text */
      font-size: 40px;
      font-weight: bold;
      animation: glow 2s infinite alternate;
      margin-bottom: 20px;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #9370db; }
      to { text-shadow: 0 0 30px #dda0dd; }
    }

    button {
      padding: 10px 20px;
      background: #4b0082;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background: #2e0854;
    }

    .gallery {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #e6e6fa; /* light purple background */
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* keeps full image visible */
      background: #e6e6fa; /* light purple background behind images */
    }

    .caption {
      position: absolute;
      bottom: 0;              /* stick to bottom edge */
      left: 0;
      width: 100%;
      padding: 15px;
      text-align: center;
      font-size: 56px;        /* large font */
      font-weight: bold;
      color: #4b0082;         /* deep purple */
      background: rgba(230, 230, 250, 0.7); /* semi-transparent strip */
      text-shadow: 2px 2px 8px #fff;
      box-sizing: border-box;
    }

    .slide.active {
      opacity: 1;
    }

    .heart {
      position: absolute;
      width: 30px;
      height: 30px;
      background: red;
      transform: rotate(45deg);
      animation: float 6s infinite;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -15px;
      left: 0;
    }

    .heart::after {
      left: 15px;
      top: 0;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="intro">
    <div class="proposal">💖 Will you be my Valentine forever? 💍❤️</div>
    <button onclick="showGallery()">Yes 💕</button>
  </div>

  <div class="gallery" id="gallery">
    <div class="slide"><img src="couple1.jpeg"><div class="caption">Neighbour Friend</div></div>
    <div class="slide"><img src="couple2.jpeg"><div class="caption">Tution Friend</div></div>
    <div class="slide"><img src="couple3.jpeg"><div class="caption">Best Friend</div></div>
    <div class="slide"><img src="couple4.jpeg"><div class="caption">Gossip Friend</div></div>
    <div class="slide"><img src="couple5.jpeg"><div class="caption">Forever Friend</div></div>
    <div class="slide"><img src="couple6.jpeg"><div class="caption">Partner in Crime</div></div>
    <div class="slide"><img src="couple7.jpeg"><div class="caption">Emergency Contact</div></div>
    <div class="slide"><img src="couple8.jpeg"><div class="caption">Forever Complain Box</div></div>
    <div class="slide"><img src="couple9.jpeg"><div class="caption">CEO of My Heart</div></div>
    <div class="slide"><img src="couple10.jpeg"><div class="caption">Comrade</div></div>
  </div>

  <!-- Background music -->
  <audio id="bgMusic" src="song.mp3"></audio>

  <script>
    // Floating hearts animation
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }
    setInterval(createHeart, 500);

    // Slideshow logic
    function showGallery() {
      // Hide intro (proposal + button)
      document.getElementById('intro').style.display = 'none';

      // Show gallery
      const gallery = document.getElementById('gallery');
      gallery.style.display = 'block';
      const slides = gallery.querySelectorAll('.slide');
      let index = 0;

      function showNextSlide() {
        slides.forEach(slide => slide.classList.remove('active'));
        slides[index].classList.add('active');
        index = (index + 1) % slides.length;
      }

      showNextSlide(); // show first slide
      setInterval(showNextSlide, 3000); // change every 3 seconds

      // Play background music (trimmed)
      const music = document.getElementById('bgMusic');
      music.currentTime = 36;   // start at 10 seconds into the song
      music.play();

      // Stop after 30 seconds
      setTimeout(() => {
        music.pause();
      }, 80000);
    }
  </script>
</body>
</html>
