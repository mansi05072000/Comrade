<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Proposal</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #ff99cc, #ff3366);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Cursive', sans-serif;
      flex-direction: column;
    }

    .proposal {
      text-align: center;
      color: white;
      font-size: 40px;
      font-weight: bold;
      animation: glow 2s infinite alternate;
      margin-bottom: 20px;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px red; }
      to { text-shadow: 0 0 30px pink; }
    }

    button {
      padding: 10px 20px;
      background: red;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background: darkred;
    }

    .gallery {
      display: none;
      margin-top: 30px;
    }
    .gallery img {
      width: 250px;
      height: auto;
      margin: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px #fff;
      animation: fadeIn 2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .heart {
      position: absolute;
      width: 30px;
      height: 30px;
      background: red;
      transform: rotate(45deg);
      animation: float 6s infinite;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -15px;
      left: 0;
    }

    .heart::after {
      left: 15px;
      top: 0;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="proposal">💖 Will you be my Valentine forever? 💍❤️</div>
  <button onclick="showGallery()">Yes 💕</button>

  <div class="gallery" id="gallery">
    <img src="couple1.jpeg" alt="Couple Photo 1">
    <img src="couple2.jpeg" alt="Couple Photo 2">
    <img src="couple3.jpeg" alt="Couple Photo 3">
    <img src="couple4.jpeg" alt="Couple Photo 3">
    <img src="couple5.jpeg" alt="Couple Photo 3">
    <img src="couple6.jpeg" alt="Couple Photo 3">
    <img src="couple7.jpeg" alt="Couple Photo 3">
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 500);

    function showGallery() {
      document.getElementById('gallery').style.display = 'block';
    }
  </script>
</body>
</html>
